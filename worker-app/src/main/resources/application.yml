spring:
  application:
    name: telemed-ia-worker
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false # Evita bucles infinitos si hay errores 400

worker:
  identity:
    url: ${IDENTITY_URL:http://localhost:8081}
  document:
    url: ${DOCUMENT_API_URL:http://localhost:8080}
